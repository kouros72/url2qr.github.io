<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="240" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="6" y1="6" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Left QR Icon Box -->
  <rect x="6" y="6" width="48" height="48" rx="13" fill="url(#iconGrad)" />
  <!-- Top-left finder -->
  <rect x="14" y="14" width="13" height="13" rx="3" stroke="#FFFFFF" stroke-width="2.4" fill="none" />
  <rect x="18.5" y="18.5" width="4" height="4" rx="1" fill="#FFFFFF" />
  <!-- Top-right finder -->
  <rect x="33" y="14" width="13" height="13" rx="3" stroke="#FFFFFF" stroke-width="2.4" fill="none" />
  <rect x="37.5" y="18.5" width="4" height="4" rx="1" fill="#FFFFFF" />
  <!-- Bottom-left finder -->
  <rect x="14" y="33" width="13" height="13" rx="3" stroke="#FFFFFF" stroke-width="2.4" fill="none" />
  <rect x="18.5" y="37.5" width="4" height="4" rx="1" fill="#FFFFFF" />
  <!-- Bottom-right QR dots -->
  <rect x="33" y="33" width="5" height="5" rx="1.2" fill="#38BDF8" />
  <rect x="41" y="33" width="5" height="5" rx="1.2" fill="#FFFFFF" />
  <rect x="37" y="37" width="5" height="5" rx="1.2" fill="#FFFFFF" />
  <rect x="33" y="41" width="5" height="5" rx="1.2" fill="#FFFFFF" />
  <rect x="41" y="41" width="5" height="5" rx="1.2" fill="#38BDF8" />

  <!-- "URL2QR" Typography -->
  <text x="66" y="39" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.8">
    <tspan fill="#0F172A">URL</tspan><tspan fill="url(#brandGrad)">2</tspan><tspan fill="#4F46E5">QR</tspan>
  </text>
</svg>
